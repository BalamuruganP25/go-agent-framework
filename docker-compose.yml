services:
  app:
    build: .
    container_name: go-agent-framework
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: phi3:mini
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  ollama_data: